name: sync-latest-boundline-tag

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync formula from latest Boundline tag
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$({
            git ls-remote --tags --refs https://github.com/apply-the/boundline.git \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          })"

          if [[ -z "$latest_tag" ]]; then
            echo "Failed to resolve latest Boundline tag" >&2
            exit 1
          fi

          curl -fsSL \
            "https://raw.githubusercontent.com/apply-the/boundline/${latest_tag}/distribution/homebrew/Formula/boundline.rb" \
            -o Formula/boundline.rb

          if git diff --quiet --exit-code -- Formula/boundline.rb; then
            echo "Formula already up to date at ${latest_tag}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/boundline.rb
          git commit -m "boundline ${latest_tag}"
          git push origin HEAD:main